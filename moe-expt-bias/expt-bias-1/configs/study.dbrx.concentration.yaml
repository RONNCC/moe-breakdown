# Experiment 1 extension — DBRX-instruct: architectural replicate at N_A/N = 0.25
#
# Motivation: validate that the Mixtral result (H≈0.917, diffuse attribution at
# N_A/N=0.25) is not architecture-specific. DBRX is an independent MoE at the
# same routing sparsity (top-4/16 = 0.25) from a different organization.
#
# Architecture: Databricks DBRX — 132B total params, 36B active, 16 experts,
# top-4 routing (N_A/N = 4/16 = 0.25). This matches Mixtral-8x7B's N_A/N exactly
# (top-2/8 = 0.25), so any difference in H is attributable to architecture/scale,
# not sparsity. Any similarity strengthens the argument that N_A/N=0.25 is
# genuinely a "less concentrated" regime.
#
# Memory requirements: 132B params × 2 bytes (bf16) ≈ 264 GB → 4× A100-80GB.
# With device_map=auto the model shards across all 4 GPUs.
# NOTE: if torch/bnb 4-bit issues persist (cf. mixtral config note re:
# nn.Module.set_submodule), bf16 sharding is the safe fallback.
#
# License: Databricks Open Model License (non-commercial allowed, US-origin).
# HuggingFace: alpindale/dbrx-instruct (community mirror — avoids the gated
# databricks/dbrx-instruct repo; HF_TOKEN not required for this mirror).

study_name: exp1-concentration-dbrx

model_id: alpindale/dbrx-instruct
model_family: dbrx
trust_remote_code: true
torch_dtype: bfloat16
load_in_4bit: false
device_map: auto

benchmarks: [stereoset, bbq, winogender]
shapley_method: routing_contrast
max_prompts: 400
seed: 42

output_root: ~/scratch/moe-breakdown-bias-runs/expt-bias-1

slurm:
  partition: ice-gpu
  qos: coc-ice
  time: 03:00:00
  cpus_per_task: 16
  gpus_per_node: 2
  gpu_type: h200
  use_gres: true
  mem: 200G
  modules: [gcc/12.3.0, python/3.11, cuda/12.6.1]
  workdir: /home/hice1/sghose7/scratch/moe-breakdown
