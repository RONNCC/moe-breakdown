# Experiment 1 v1 — Gemma 4 26B (A4B), full prompt set
# 26B bf16 ≈ 52 GB → 1×H100. routing_contrast 2 fwd passes/pair.
# 5000 pairs ≈ 3-4 hr on H100 → time 06:00:00.

study_name: exp1-concentration-gemma4-26b-v1

model_id: google/gemma-4-26B-A4B-it
model_family: gemma4moe
trust_remote_code: false
torch_dtype: bfloat16
load_in_4bit: false
device_map: auto

benchmarks: [stereoset, bbq, winogender]
shapley_method: routing_contrast
max_prompts: 5000
seed: 42

output_root: ~/scratch/moe-breakdown-bias-runs/expt-bias-1

slurm:
  partition: ice-gpu
  qos: coc-ice
  time: 06:00:00
  cpus_per_task: 8
  gpus_per_node: 1
  gpu_type: h100
  use_gres: true
  mem: 80G
  modules: [gcc/12.3.0, python/3.11, cuda/12.6.1]
  workdir: /home/hice1/sghose7/scratch/moe-breakdown