# Experiment 1 v1 — GPT-OSS-120B, full prompt set
# Same as study.gpt-oss-120b.concentration.yaml but max_prompts: 2000.
# routing_contrast: 2 fwd passes/pair. 120B MXFP4 on 2×H200 — MXFP4 is
# faster than bf16; at ~3s/pair, 2000 pairs ≈ 1.7hr. Bumped to 4hr for headroom.
# 2×H200×4hr = 480 GPU-min ✓ (under 960 QOS cap).

study_name: exp1-concentration-gpt-oss-120b-v1

model_id: openai/gpt-oss-120b
model_family: gpt-oss
trust_remote_code: false
torch_dtype: bfloat16
load_in_4bit: false
device_map: auto

benchmarks: [stereoset, bbq, winogender]
shapley_method: routing_contrast
max_prompts: 2000
seed: 42

output_root: ~/scratch/moe-breakdown-bias-runs/expt-bias-1

slurm:
  partition: ice-gpu
  qos: coc-ice
  time: 04:00:00
  cpus_per_task: 16
  gpus_per_node: 2
  gpu_type: h200
  use_gres: true
  mem: 200G
  modules: [gcc/12.3.0, python/3.11, cuda/12.6.1]
  workdir: /home/hice1/sghose7/scratch/moe-breakdown
