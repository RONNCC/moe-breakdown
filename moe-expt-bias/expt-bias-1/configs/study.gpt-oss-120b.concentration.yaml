# Experiment 1 extension — GPT-OSS-120B: fills N_A/N gap between OLMoE and Phi
#
# N_A/N = 4/128 ≈ 0.031 — sits between OLMoE (0.016) and Phi-3.5-MoE (0.125),
# which is exactly the gap on the sparsity ladder most important for H1.
# Architecture: 128 experts, top-4 per token, ~117B total, ~5.1B active/token.
# License: Apache 2.0 (GT ICE policy: fine — US-origin, OpenAI).
#
# HuggingFace: openai/gpt-oss-120b
#
# Weights are stored as native MXFP4. Transformers>=5.13 has a built-in
# QuantizerMXFP4 that handles loading; it requires torch>=2.5 (for
# torch.accelerator). Bootstrap pins torch>=2.5.0 (upgraded from 2.4.0
# specifically for this model). H200 (Hopper sm_90) supports MXFP4.
#
# Memory: MXFP4-quantized MoE weights → single H200 (80GB) per OpenAI docs,
# but using 2× H200 for headroom with device_map=auto.

study_name: exp1-concentration-gpt-oss-120b

model_id: openai/gpt-oss-120b
model_family: gpt-oss
trust_remote_code: false
torch_dtype: bfloat16
load_in_4bit: false
device_map: auto

benchmarks: [stereoset, bbq, winogender]
shapley_method: routing_contrast
max_prompts: 400
seed: 42

output_root: ~/scratch/moe-breakdown-bias-runs/expt-bias-1

slurm:
  partition: ice-gpu
  qos: coc-ice
  time: 03:00:00
  cpus_per_task: 16
  gpus_per_node: 2
  gpu_type: h100
  use_gres: true
  mem: 200G
  modules: [gcc/12.3.0, python/3.11, cuda/12.6.1]
  workdir: /home/hice1/sghose7/scratch/moe-breakdown
