# Experiment 2 (RQ2 / C4) — dense cross-check 2: Llama-2-7B
#
# Fourth dense baseline — a cross-generation complement to Llama-3.1-8B
# (exp2-dense-crosscheck-llama-3.1-8b). Same ~7B scale and 32-layer depth;
# different training data and generation (Llama 2 vs 3.1) isolates whether
# bias diffuseness is generation-specific or a stable dense-architecture
# property. Paired with OLMoE (same scale class) and OLMo-7B (primary
# matched pair).
#
# Using NousResearch/Llama-2-7b-hf — ungated community mirror, same Llama 2
# Community License (Meta, US-origin). The official meta-llama/Llama-2-7b-hf
# repo is gated; this cluster account uses the NousResearch mirror to avoid
# the HF approval gate.
#
# Compute: 32 layers × 2 LOO passes × 400 pairs ≈ 25600 fwd passes at ~0.3s
# each ≈ 128 min. 4hr wall time is conservative.

study_name: exp2-dense-crosscheck-llama-2-7b

model_id: NousResearch/Llama-2-7b-hf
model_family: llama
trust_remote_code: false
torch_dtype: bfloat16
device_map: auto

benchmarks: [stereoset, bbq, winogender]
shapley_method: dense_loo
max_prompts: 400
seed: 42

output_root: ~/scratch/moe-breakdown-bias-runs/expt-bias-1

slurm:
  partition: ice-gpu
  qos: coc-ice
  time: 04:00:00
  cpus_per_task: 8
  gpus_per_node: 1
  gpu_type: a100
  use_gres: true
  mem: 48G
  modules: [gcc/12.3.0, python/3.11, cuda/12.1.1]
  workdir: /home/hice1/sghose7/scratch/moe-breakdown
