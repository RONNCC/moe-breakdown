# Experiment 2 (RQ2 / C4) — dense cross-check: Llama-3.1-8B (dense)
#
# Third dense baseline (Llama Community License / Meta) per the model ladder
# in study_design_C1_C4.md Sec 2.1 — an independent-family dense cross-check
# alongside the OLMoE/OLMo-7B (primary) and Phi-3.5-MoE/Phi-3.5-mini
# (secondary) matched pairs. Not a matched-family pair by itself; used to
# confirm H2's dense-side entropy isn't an OLMo-specific artifact.
#
# NOTE: the official meta-llama/Llama-3.1-8B repo is HF-gated and this
# cluster account's HF_TOKEN does not (yet) have an approved access grant
# (job failed with "you are not in the authorized list" even with the token
# present/propagated via --export=ALL). Using the NousResearch community
# mirror instead — identical weights/config, still governed by the same
# Llama Community License, just hosted ungated. Switch back to the official
# repo id once gated access is approved, if exact-provenance matters.

study_name: exp2-dense-crosscheck-llama-3.1-8b

model_id: NousResearch/Meta-Llama-3.1-8B
model_family: llama
trust_remote_code: false
torch_dtype: bfloat16
device_map: auto

benchmarks: [stereoset, bbq, winogender]
shapley_method: dense_loo
max_prompts: 400
seed: 42

output_root: ~/scratch/moe-breakdown-bias-runs/expt-bias-1

slurm:
  partition: ice-gpu
  qos: coc-ice
  time: 04:00:00
  cpus_per_task: 8
  gpus_per_node: 1
  gpu_type: l40s
  use_gres: true
  mem: 64G
  modules: [gcc/12.3.0, python/3.11, cuda/12.1.1]
  workdir: /home/hice1/sghose7/scratch/moe-breakdown
  # uv_env_dir intentionally unset -> sbatch script defaults to $TMPDIR.
