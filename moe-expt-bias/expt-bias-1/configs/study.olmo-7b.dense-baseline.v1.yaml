# Experiment 2 v1 — OLMo-7B, full prompt set
# Same as study.olmo-7b.dense-baseline.yaml but max_prompts bumped to 700.
# dense_loo: 32 layers × 2 passes/layer + 2 baseline = 66 passes/pair.
# At ~0.3s/pass on 1×A100: 700 × 66 × 0.3s ≈ 3.85hr → 4:30:00 wall time.
# Original had max_prompts: 150 (overly conservative for a 6hr job).
# 1×A100×4.5hr = 270 GPU-min ✓ (under 960 QOS cap).

study_name: exp2-dense-baseline-olmo-7b-v1

model_id: allenai/OLMo-7B-hf
model_family: olmo
trust_remote_code: false
torch_dtype: bfloat16
device_map: auto

benchmarks: [stereoset, bbq, winogender]
shapley_method: dense_loo
max_prompts: 700
seed: 42

output_root: ~/scratch/moe-breakdown-bias-runs/expt-bias-1

slurm:
  partition: ice-gpu
  qos: coc-ice
  time: 04:30:00
  cpus_per_task: 8
  gpus_per_node: 1
  gpu_type: a100
  use_gres: true
  mem: 64G
  modules: [gcc/12.3.0, python/3.11, cuda/12.1.1]
  workdir: /home/hice1/sghose7/scratch/moe-breakdown
