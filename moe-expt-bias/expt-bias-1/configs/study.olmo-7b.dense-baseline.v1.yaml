# Experiment 2 v1 — OLMo-7B, sharded full prompt set
# Submit with: python3 scripts/submit_slurm_study.py --config ... --num-shards 2
# dense_loo: 32 layers → 66 passes/pair. At ~0.3s/pass on 1×A100:
# 1800 total / 2 shards → 900 pairs each × 66 × 0.3s ≈ 4.95hr.
# 2 jobs × 1×A100×5hr = 600 GPU-min total ✓.

study_name: exp2-dense-baseline-olmo-7b-v1

model_id: allenai/OLMo-7B-hf
model_family: olmo
trust_remote_code: false
torch_dtype: bfloat16
device_map: auto

benchmarks: [stereoset, bbq, winogender]
shapley_method: dense_loo
max_prompts: 1800
seed: 42

output_root: ~/scratch/moe-breakdown-bias-runs/expt-bias-1

slurm:
  partition: ice-gpu
  qos: coc-ice
  time: 05:00:00
  cpus_per_task: 8
  gpus_per_node: 1
  gpu_type: l40s
  use_gres: true
  mem: 64G
  modules: [gcc/12.3.0, python/3.11, cuda/12.1.1]
  workdir: /home/hice1/sghose7/scratch/moe-breakdown
