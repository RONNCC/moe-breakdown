# Experiment 1 v1 — OLMoE-1B-7B, full prompt set
# routing_contrast: 2 fwd passes/pair — 5000 pairs ≈ 42 min on 1×A100.

study_name: exp1-concentration-olmoe-1b-7b-v1

model_id: allenai/OLMoE-1B-7B-0924
model_family: olmoe
trust_remote_code: false
torch_dtype: bfloat16
device_map: auto

benchmarks: [stereoset, bbq, winogender]
shapley_method: routing_contrast
max_prompts: 5000
seed: 42

output_root: ~/scratch/moe-breakdown-bias-runs/expt-bias-1

slurm:
  partition: ice-gpu
  qos: coc-ice
  time: 04:00:00
  cpus_per_task: 8
  gpus_per_node: 1
  gpu_type: 40gb
  use_gres: true
  mem: 64G
  modules: [gcc/12.3.0, python/3.11, cuda/12.1.1]
  workdir: /home/hice1/sghose7/scratch/moe-breakdown
