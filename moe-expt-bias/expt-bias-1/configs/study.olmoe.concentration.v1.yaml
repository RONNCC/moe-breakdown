# Experiment 1 v1 — OLMoE-1B-7B, full prompt set
# Same as study.olmoe.concentration.yaml but with max_prompts bumped to 2000.
# routing_contrast costs only 2 fwd passes/pair, so 2000 pairs ≈ 30 min on
# 1×A100 — the original 400-pair cap was copied from the more expensive dense
# LOO configs and was unnecessarily conservative here.

study_name: exp1-concentration-olmoe-1b-7b-v1

model_id: allenai/OLMoE-1B-7B-0924
model_family: olmoe
trust_remote_code: false
torch_dtype: bfloat16
device_map: auto

benchmarks: [stereoset, bbq, winogender]
shapley_method: routing_contrast
max_prompts: 2000
seed: 42

output_root: ~/scratch/moe-breakdown-bias-runs/expt-bias-1

slurm:
  partition: ice-gpu
  qos: coc-ice
  time: 04:00:00
  cpus_per_task: 8
  gpus_per_node: 1
  gpu_type: a100
  use_gres: true
  mem: 64G
  modules: [gcc/12.3.0, python/3.11, cuda/12.1.1]
  workdir: /home/hice1/sghose7/scratch/moe-breakdown
