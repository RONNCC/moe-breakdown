# Experiment 1 (RQ1 / C1) — Concentration vs sparsity ladder, point 1/4: OLMoE-1B-7B
#
# Sparsest model on the ladder (top-1 routing, N_A/N ≈ 0.06, 64 experts).
# Bias-Shapley method: routing_contrast (fast, router-weighted counterfactual
# bias-gap attribution — see src/moe_bias_shapley/shapley.py).
#
# Compare concentration metrics (entropy H, Gini, top-fraction) against
# study.qwen3-30b-a3b.concentration.yaml, study.mixtral-8x7b.concentration.yaml,
# and study.ernie-4.5-21b-a3b.concentration.yaml to test H1 (monotonic
# concentration increase as sparsity increases).

study_name: exp1-concentration-olmoe-1b-7b

model_id: allenai/OLMoE-1B-7B-0924
model_family: olmoe
trust_remote_code: false
torch_dtype: bfloat16
device_map: auto

benchmarks: [stereoset, bbq]
shapley_method: routing_contrast
max_prompts: 400
seed: 42

output_root: ~/scratch/moe-breakdown-bias-runs/expt-bias-1

slurm:
  partition: ice-gpu
  qos: coc-ice
  time: 04:00:00
  cpus_per_task: 8
  gpus_per_node: 1
  gpu_type: a100
  use_gres: true
  mem: 64G
  modules: [gcc/12.3.0, python/3.11, cuda/12.1.1]
  workdir: /home/hice1/sghose7/scratch/moe-breakdown
  # uv_env_dir intentionally unset -> sbatch script defaults to $TMPDIR (node-local
  # ephemeral scratch), keeping the venv off the space-constrained persistent scratch.
