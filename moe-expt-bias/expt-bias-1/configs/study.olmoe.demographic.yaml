# Experiment 5 (RQ3 / C3) — Demographic specificity on OLMoE-1B-7B
#
# Same model/method as study.olmoe.concentration.yaml, but
# run_bias_study.py additionally splits the routing_contrast attribution by
# demographic cohort (StereoSet `target` field: gender / race / religion /
# profession groups) whenever "demographic" appears in study_name (see
# scripts/run_bias_study.py::run_study). Per-group phi vectors + concentration
# metrics are saved so downstream analysis can compute Jensen-Shannon
# divergence across cohorts (Sec 3.5) to test whether different experts fire
# per demographic group vs the same expert flipping sign.

study_name: exp5-demographic-specificity-olmoe-1b-7b

model_id: allenai/OLMoE-1B-7B-0924
model_family: olmoe
trust_remote_code: false
torch_dtype: bfloat16
device_map: auto

benchmarks: [stereoset, bbq]
shapley_method: routing_contrast
max_prompts: 600   # need enough coverage per demographic cohort
seed: 42

output_root: ~/scratch/moe-breakdown-bias-runs/expt-bias-1

slurm:
  partition: ice-gpu
  qos: coc-ice
  time: 05:00:00
  cpus_per_task: 8
  gpus_per_node: 1
  gpu_type: a100
  use_gres: true
  mem: 64G
  modules: [gcc/12.3.0, python/3.11, cuda/12.1.1]
  workdir: /home/hice1/sghose7/scratch/moe-breakdown
  uv_env_dir: /storage/ice1/0/2/sghose7/moe-bias-shapley-venv
