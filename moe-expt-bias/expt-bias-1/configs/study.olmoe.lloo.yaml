# Experiment 8 (same-mechanism comparison) — OLMoE-1B-7B with layer-LOO
#
# Runs dense-style leave-one-out (LOO) layer attribution on OLMoE — the same
# method used for dense baselines (OLMo-7B etc.) — enabling an apples-to-apples
# H comparison between MoE and dense models without the method-confound that
# afflicts the Exp1 vs Exp2 comparison (routing_contrast for MoE, LOO for dense).
#
# Expected: if H_lloo(OLMoE) ≈ H_rc(OLMoE) ≈ 0.90, the method confound does not
# explain the Exp2 gap (H_dense ≈ 0.70) and the localizability result holds. If
# H_lloo(OLMoE) drops toward H_dense, it suggests routing_contrast inflates H.

study_name: exp8-lloo-olmoe-1b-7b

model_id: allenai/OLMoE-1B-7B-0924
model_family: olmoe
trust_remote_code: false
torch_dtype: bfloat16
device_map: auto

benchmarks: [stereoset, bbq, winogender]
shapley_method: dense_loo   # force LOO even though model is MoE
max_prompts: 100
seed: 42

output_root: ~/scratch/moe-breakdown-bias-runs/expt-bias-1

slurm:
  partition: ice-gpu
  qos: coc-ice
  time: 03:00:00
  cpus_per_task: 8
  gpus_per_node: 1
  gpu_type: 40gb
  use_gres: true
  mem: 64G
  modules: [gcc/12.3.0, python/3.11, cuda/12.1.1]
  workdir: /home/hice1/sghose7/scratch/moe-breakdown
