# Experiment 2 v1 — Phi-3.5-mini, sharded full prompt set
# Submit with: python3 scripts/submit_slurm_study.py --config ... --num-shards 2
# dense_loo: 3.8B model, ~0.1s/pass → 4000 total / 2 shards → 2000 pairs each.
# 2000 × 66 × 0.1s ≈ 3.7hr per shard. 2 jobs × 1×A100×5hr = 600 GPU-min ✓.

study_name: exp2-dense-baseline-phi3.5-mini-v1

model_id: microsoft/Phi-3.5-mini-instruct
model_family: dense
trust_remote_code: false
torch_dtype: bfloat16
device_map: auto

benchmarks: [stereoset, bbq, winogender]
shapley_method: dense_loo
max_prompts: 4000
seed: 42

output_root: ~/scratch/moe-breakdown-bias-runs/expt-bias-1

slurm:
  partition: ice-gpu
  qos: coc-ice
  time: 05:00:00
  cpus_per_task: 8
  gpus_per_node: 1
  gpu_type: 40gb
  use_gres: true
  mem: 64G
  modules: [gcc/12.3.0, python/3.11, cuda/12.1.1]
  workdir: /home/hice1/sghose7/scratch/moe-breakdown
