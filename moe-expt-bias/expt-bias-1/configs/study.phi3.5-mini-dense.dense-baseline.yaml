# Experiment 2 (RQ2 / C4) — MoE vs dense localizability, secondary pair: Phi-3.5 dense
#
# Dense sibling of Phi-3.5-MoE (3.8B, MIT-licensed, Microsoft). Secondary
# matched comparison alongside the primary OLMoE-1B-7B vs OLMo-7B pair (per
# study_design_C1_C4.md Sec 2.1/3.2). Replaces the disallowed Qwen3-8B-dense
# slot.

study_name: exp2-dense-baseline-phi3.5-mini

model_id: microsoft/Phi-3.5-mini-instruct
model_family: dense
# trust_remote_code=false: use transformers' native Phi3ForCausalLM instead of
# the repo's bundled custom modeling code, which calls the removed
# DynamicCache.from_legacy_cache API on the installed transformers version
# (AttributeError). Native support has been in transformers since 4.41.
trust_remote_code: false
torch_dtype: bfloat16
device_map: auto

benchmarks: [stereoset, bbq, winogender]
shapley_method: dense_loo
max_prompts: 400
seed: 42

output_root: ~/scratch/moe-breakdown-bias-runs/expt-bias-1

slurm:
  partition: ice-gpu
  qos: coc-ice
  time: 04:00:00
  cpus_per_task: 8
  gpus_per_node: 1
  gpu_type: 40gb
  use_gres: true
  mem: 64G
  modules: [gcc/12.3.0, python/3.11, cuda/12.1.1]
  workdir: /home/hice1/sghose7/scratch/moe-breakdown
  # uv_env_dir intentionally unset -> sbatch script defaults to $TMPDIR.
