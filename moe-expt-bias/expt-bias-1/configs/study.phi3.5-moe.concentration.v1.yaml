# Experiment 1 v1 — Phi-3.5-MoE, full prompt set
# routing_contrast: 2 fwd passes/pair. 42B on 2×A100 — 5000 pairs ≈ 2.8hr.

study_name: exp1-concentration-phi3.5-moe-v1

model_id: microsoft/Phi-3.5-MoE-instruct
model_family: phi3.5moe
trust_remote_code: false
torch_dtype: bfloat16
device_map: auto

benchmarks: [stereoset, bbq, winogender]
shapley_method: routing_contrast
max_prompts: 5000
seed: 42

output_root: ~/scratch/moe-breakdown-bias-runs/expt-bias-1

slurm:
  partition: ice-gpu
  qos: coc-ice
  time: 05:00:00
  cpus_per_task: 8
  gpus_per_node: 2
  gpu_type: 80gb
  use_gres: true
  mem: 96G
  modules: [gcc/12.3.0, python/3.11, cuda/12.1.1]
  workdir: /home/hice1/sghose7/scratch/moe-breakdown
