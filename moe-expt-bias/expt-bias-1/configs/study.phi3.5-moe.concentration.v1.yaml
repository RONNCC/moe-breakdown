# Experiment 1 v1 — Phi-3.5-MoE, full prompt set
# Same as study.phi3.5-moe.concentration.yaml but max_prompts: 2000.
# routing_contrast: 2 fwd passes/pair. At ~2s/pair on 2×A100 (42B bf16),
# 2000 pairs ≈ 67 min — well within 6hr wall time.

study_name: exp1-concentration-phi3.5-moe-v1

model_id: microsoft/Phi-3.5-MoE-instruct
model_family: phi3.5moe
trust_remote_code: false
torch_dtype: bfloat16
device_map: auto

benchmarks: [stereoset, bbq, winogender]
shapley_method: routing_contrast
max_prompts: 2000
seed: 42

output_root: ~/scratch/moe-breakdown-bias-runs/expt-bias-1

slurm:
  partition: ice-gpu
  qos: coc-ice
  time: 06:00:00
  cpus_per_task: 8
  gpus_per_node: 2
  gpu_type: a100
  use_gres: true
  mem: 96G
  modules: [gcc/12.3.0, python/3.11, cuda/12.1.1]
  workdir: /home/hice1/sghose7/scratch/moe-breakdown
