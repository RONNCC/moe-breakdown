# Experiment 1 (RQ1 / C1) — Concentration vs sparsity ladder, point 2/3: Phi-3.5-MoE
#
# Mid-sparsity MoE (top-2/16 routing, N_A/N ~ 0.125, 6.6B/42B active/total).
# MIT-licensed (Microsoft); fills the mid-sparsity slot between OLMoE (top-1/64)
# and Mixtral-8x7B (top-2/8). Complies with GT ICE institutional policy.
#
# NOTE: Phi-3.5-MoE's HF modeling code (PhimoeForCausalLM /
# PhimoeSparseMoeBlock) may require trust_remote_code depending on the
# transformers version installed on the cluster — verify at run time and set
# trust_remote_code: false if it's natively supported (integrated upstream).

study_name: exp1-concentration-phi3.5-moe

model_id: microsoft/Phi-3.5-MoE-instruct
model_family: phi3.5moe
# trust_remote_code=false: transformers>=4.44 has a native "phimoe" module
# (confirmed: transformers.models.phimoe importable) — using it instead of
# the repo's custom modeling_phimoe.py avoids a hard dependency on
# einops/flash_attn, which that custom file unconditionally imports even
# though we don't need flash-attention for this study.
trust_remote_code: false
torch_dtype: bfloat16
device_map: auto

benchmarks: [stereoset, bbq, winogender]
shapley_method: routing_contrast
max_prompts: 400
seed: 42

output_root: ~/scratch/moe-breakdown-bias-runs/expt-bias-1

slurm:
  partition: ice-gpu
  qos: coc-ice
  time: 06:00:00
  cpus_per_task: 8
  gpus_per_node: 2
  gpu_type: 80gb
  use_gres: true
  mem: 96G
  modules: [gcc/12.3.0, python/3.11, cuda/12.1.1]
  workdir: /home/hice1/sghose7/scratch/moe-breakdown
  # uv_env_dir intentionally unset -> sbatch script defaults to $TMPDIR.
