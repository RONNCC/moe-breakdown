# Experiment 1 (RQ1 / C1) — Concentration vs sparsity ladder, point 2/4: Qwen3-30B-A3B
#
# Sparse, large model (N_A/N ~ 0.06-0.10, 128 experts, top-8 routing).
# 30B total params in bf16 (~60GB) — request 2 A100 GPUs with device_map=auto
# to shard across GPUs instead of bitsandbytes 4-bit quantization (the
# installed torch==2.4.0 lacks nn.Module.set_submodule, which the bnb
# quantizer integration in current transformers requires — avoid that
# incompatibility entirely rather than pin a newer torch).

study_name: exp1-concentration-qwen3-30b-a3b

model_id: Qwen/Qwen3-30B-A3B
model_family: qwen3
trust_remote_code: false
torch_dtype: bfloat16
load_in_4bit: false
device_map: auto

benchmarks: [stereoset, bbq]
shapley_method: routing_contrast
max_prompts: 400
seed: 42

output_root: ~/scratch/moe-breakdown-bias-runs/expt-bias-1

slurm:
  partition: ice-gpu
  qos: coc-ice
  time: 06:00:00
  cpus_per_task: 8
  gpus_per_node: 2
  gpu_type: a100
  use_gres: true
  mem: 96G
  modules: [gcc/12.3.0, python/3.11, cuda/12.1.1]
  workdir: /home/hice1/sghose7/scratch/moe-breakdown
  uv_env_dir: /storage/ice1/0/2/sghose7/moe-bias-shapley-venv
