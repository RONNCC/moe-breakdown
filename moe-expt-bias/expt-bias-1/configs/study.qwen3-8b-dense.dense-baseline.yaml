# Experiment 2 (RQ2 / C4) — Secondary MoE-vs-dense cross-check: Qwen3-8B (dense)
#
# Not a perfectly matched pair with Qwen3-30B-A3B (different total params /
# training run), but serves as a second dense comparator per Sec 2.1
# ("Qwen3 vs a dense Qwen"), to check H2 isn't an artifact of the single
# OLMoE/OLMo-7B pair. Report alongside the primary pair, not as a substitute.

study_name: exp2-dense-crosscheck-qwen3-8b

model_id: Qwen/Qwen3-8B
model_family: dense
trust_remote_code: false
torch_dtype: bfloat16
device_map: auto

benchmarks: [stereoset, bbq]
shapley_method: dense_loo
max_prompts: 150
seed: 42

output_root: ~/scratch/moe-breakdown-bias-runs/expt-bias-1

slurm:
  partition: ice-gpu
  qos: coc-ice
  time: 06:00:00
  cpus_per_task: 8
  gpus_per_node: 1
  gpu_type: a100
  use_gres: true
  mem: 64G
  modules: [gcc/12.3.0, python/3.11, cuda/12.1.1]
  workdir: /home/hice1/sghose7/scratch/moe-breakdown
  uv_env_dir: /storage/ice1/0/2/sghose7/moe-bias-shapley-venv
